[workspace]
members = ["crates/enowx-core", "crates/enowx-server", "crates/enowx-tui", "crates/enowx-cli"]
default-members = ["crates/enowx-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
enowx-core = { path = "crates/enowx-core" }
enowx-server = { path = "crates/enowx-server" }
enowx-tui = { path = "crates/enowx-tui" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
crossterm = "0.28"
ratatui = "0.29"
textwrap = "0.16"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
nix = { version = "0.29", features = ["signal", "process"] }
mime_guess = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
